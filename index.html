<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Komitmen Restu</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --accent:#4caf50;--light:#f0faf0;--color:#a8d5a2;--dark:#2e7d32;
  --shadow:rgba(76,175,80,0.2);
}
body{font-family:'Nunito',sans-serif;background:var(--light);min-height:100vh;color:#333}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:var(--color);border-radius:4px}

/* ANIMATIONS */
@keyframes popIn{0%{transform:scale(0.8);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes glow{0%,100%{box-shadow:0 0 16px 4px var(--shadow)}50%{box-shadow:0 0 32px 10px var(--shadow)}}
@keyframes checkBounce{0%{transform:scale(0)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

/* HEADER */
#header{
  background:linear-gradient(135deg,var(--dark),var(--accent));
  padding:20px 20px 14px;color:#fff;
  box-shadow:0 4px 20px var(--shadow);
  position:sticky;top:0;z-index:100;
}
.header-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10}
.app-title{font-family:'Playfair Display',serif;font-size:26px;font-weight:900;letter-spacing:-0.5px}
.app-sub{font-size:12px;opacity:.88;margin-top:3px;font-weight:600}
.streak-badge{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(255,255,255,0.2);border:2px solid rgba(255,255,255,0.4);
  border-radius:20px;padding:6px 14px;white-space:nowrap;
  backdrop-filter:blur(4px);
}
.streak-badge .emoji{font-size:20px}
.streak-badge .name{font-weight:800;font-size:13px}
.streak-badge .num{font-weight:900;font-size:17px}
.header-quote{
  margin-top:10px;background:rgba(255,255,255,0.18);
  border-radius:12px;padding:8px 14px;font-size:13px;font-weight:700;
}

/* NAV */
#nav{
  display:flex;background:#fff;
  border-bottom:2px solid rgba(0,0,0,0.06);
  overflow-x:auto;padding:0 4px;
  position:sticky;top:76px;z-index:99;
  box-shadow:0 2px 8px rgba(0,0,0,0.04);
}
#nav::-webkit-scrollbar{height:0}
.nav-btn{
  flex:0 0 auto;padding:10px 14px;background:none;border:none;cursor:pointer;
  border-bottom:3px solid transparent;color:#999;font-weight:800;font-size:11px;
  font-family:'Nunito',sans-serif;display:flex;flex-direction:column;align-items:center;gap:2px;
  transition:all .2s;
}
.nav-btn .icon{font-size:18px}
.nav-btn.active{color:var(--dark);border-bottom-color:var(--accent)}
.nav-btn:hover{transform:translateY(-2px)}

/* CONTENT */
#content{max-width:640px;margin:0 auto;padding:16px;animation:slideUp .3s ease}

/* CARD */
.card{
  background:#fff;border-radius:20px;padding:16px;margin-bottom:16px;
  box-shadow:0 2px 16px var(--shadow);
}
.card-title{font-weight:900;font-size:16px;color:#333;margin-bottom:12px;display:flex;align-items:center;gap:6px}

/* AI COMPANION */
#companion-wrap{text-align:center;padding:8px 0 12px}
#companion-orb{
  width:70px;height:70px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,var(--color),var(--dark));
  box-shadow:0 0 16px 4px var(--shadow);
  display:inline-flex;align-items:center;justify-content:center;
  font-size:34px;margin:0 auto;
  transition:all .5s cubic-bezier(.36,.07,.19,.97);cursor:default;
}
#companion-orb.big{width:90px;height:90px;font-size:44px;animation:glow 1.5s infinite}
#companion-msg{
  max-width:280px;margin:10px auto 0;text-align:center;
  background:var(--light);border:1.5px solid var(--color);
  border-radius:16px;padding:10px 16px;
  font-weight:700;color:var(--dark);font-size:14px;
  animation:fadeIn .5s ease;display:none;
}
#companion-msg.show{display:block}
#again-btn{
  display:none;margin:8px auto 0;padding:6px 18px;border-radius:20px;
  background:var(--light);border:2px solid var(--color);
  color:var(--dark);font-weight:800;cursor:pointer;font-size:13px;
  font-family:'Nunito',sans-serif;
}
#again-btn.show{display:inline-block}

/* PROGRESS RING */
.ring-wrap{position:relative;width:60px;height:60px;flex-shrink:0}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-text{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:12px;color:var(--dark);
}

/* CHECK ITEMS */
.act-item{
  display:flex;align-items:center;gap:12px;
  padding:12px 14px;margin-bottom:8px;
  background:#fafafa;border:2px solid #eee;border-radius:14px;
  cursor:pointer;user-select:none;transition:all .2s;
}
.act-item:hover{transform:translateX(4px)}
.act-item.done{background:var(--light);border-color:var(--color)}
.act-check{
  width:28px;height:28px;border-radius:50%;background:#e0e0e0;
  display:flex;align-items:center;justify-content:center;
  font-size:15px;color:#fff;flex-shrink:0;font-weight:900;
  transition:all .3s;
}
.act-item.done .act-check{background:var(--accent);animation:checkBounce .3s ease}
.act-name{font-weight:700;font-size:15px;color:#444;flex:1;transition:all .2s}
.act-item.done .act-name{color:var(--dark);text-decoration:line-through;opacity:.8}

/* TEXTAREA */
textarea{
  width:100%;border-radius:12px;border:2px solid rgba(0,0,0,0.08);
  padding:12px 14px;font-family:'Nunito',sans-serif;font-size:14px;
  line-height:1.7;resize:none;color:#333;background:var(--light);
  font-weight:600;transition:border-color .2s;
}
textarea:focus{border-color:var(--accent);outline:none}
input[type=date],input[type=month]{
  border:2px solid var(--color);border-radius:12px;padding:8px 14px;
  font-family:'Nunito',sans-serif;font-weight:700;font-size:14px;color:var(--dark);
  background:var(--light);cursor:pointer;width:100%;
}

/* BUTTONS */
.btn{
  padding:10px 24px;border-radius:20px;border:none;color:#fff;
  background:var(--accent);font-weight:800;cursor:pointer;font-size:14px;
  font-family:'Nunito',sans-serif;transition:all .2s;
}
.btn:hover{opacity:.9;transform:translateY(-1px)}
.btn.sm{padding:6px 16px;font-size:12px}
.btn.outline{background:var(--light);color:var(--dark);border:2px solid var(--color)}
.btn.danger{background:#fee;color:#c00;border:1.5px solid #f88}

/* LEVEL PILLS */
.level-row{
  display:flex;align-items:center;gap:10px;padding:8px 12px;
  border-radius:12px;margin-bottom:6px;background:#fafafa;
  border:1.5px solid #eee;transition:all .2s;
}
.level-row.active{border-color:var(--color);background:var(--light)}
.level-here{font-weight:900;font-size:10px;color:var(--dark);background:var(--light);padding:3px 8px;border-radius:8px;border:1px solid var(--color)}

/* CALENDAR */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-head{text-align:center;font-size:10px;font-weight:800;color:#aaa;padding:2px}
.cal-day{
  aspect-ratio:1;border-radius:8px;background:#f5f5f5;border:2px solid transparent;
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  font-size:11px;font-weight:800;color:#666;cursor:pointer;transition:transform .15s;
  position:relative;
}
.cal-day:hover{transform:scale(1.1)}
.cal-day.today{border-color:var(--accent)!important}
.cal-dot{width:4px;height:4px;border-radius:50%;margin-top:1px}

/* STATS GRID */
.stats-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px}
.stat-box{
  background:var(--light);border:1.5px solid var(--color);
  border-radius:14px;padding:12px 8px;text-align:center;
}
.stat-emoji{font-size:22px}
.stat-val{font-weight:900;font-size:22px;color:var(--dark)}
.stat-label{font-size:11px;font-weight:700;color:#888}

/* ACTIVITY MANAGE */
.manage-item{
  display:flex;align-items:center;gap:10px;padding:12px 14px;
  background:#fafafa;border:1.5px solid #eee;border-radius:14px;margin-bottom:8px;
}
.add-panel{
  background:var(--light);border:2px solid var(--color);
  border-radius:14px;padding:14px;margin-bottom:16px;
  animation:fadeIn .3s ease;
}
.emoji-grid{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.emoji-opt{
  width:38px;height:38px;border-radius:10px;font-size:20px;
  background:#fff;border:2px solid #eee;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all .15s;
}
.emoji-opt:hover,.emoji-opt.sel{background:var(--light);border-color:var(--accent)}
input[type=text]{
  flex:1;border-radius:12px;border:2px solid rgba(0,0,0,0.08);
  padding:10px 14px;font-family:'Nunito',sans-serif;font-weight:700;
  font-size:14px;color:#333;
}
input[type=text]:focus{border-color:var(--accent);outline:none}

/* FOLDER ARCHIVE */
.archive-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 14px;background:#fafafa;border:1.5px solid #eee;
  border-radius:12px;margin-bottom:8px;cursor:pointer;transition:all .15s;
}
.archive-row:hover{background:var(--light);border-color:var(--color)}

/* TAG PILLS */
.tag{
  display:inline-flex;align-items:center;gap:4px;
  padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700;
  background:#f5f5f5;border:1.5px solid #ddd;color:#aaa;
}
.tag.done{background:var(--light);border-color:var(--color);color:var(--dark)}

/* LOADING */
.spin{display:inline-block;animation:spin 1s linear infinite}

/* EMPTY */
.empty{text-align:center;padding:24px 0;color:#ccc;font-size:14px;font-weight:700}

/* MODAL */
.modal-bg{
  position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:200;
  display:flex;align-items:center;justify-content:center;padding:20px;
  animation:fadeIn .2s ease;
}
.modal{background:#fff;border-radius:20px;padding:20px;max-width:360px;width:100%;animation:popIn .3s ease}
.modal-title{font-weight:900;font-size:18px;color:#333;margin-bottom:14px}

@media(max-width:400px){
  .app-title{font-size:21px}
  .streak-badge .name{display:none}
}
</style>
</head>
<body>

<!-- HEADER -->
<div id="header">
  <div class="header-row">
    <div>
      <div class="app-title">Komitmen <span style="opacity:.85">Restu</span></div>
      <div class="app-sub" id="header-date"></div>
    </div>
    <div class="streak-badge" id="streak-badge">
      <span class="emoji" id="badge-emoji">🌱</span>
      <span class="name" id="badge-name">Pemula</span>
      <span class="num" id="badge-num">0🔥</span>
    </div>
  </div>
  <div class="header-quote" id="header-quote"></div>
</div>

<!-- NAV -->
<div id="nav">
  <button class="nav-btn active" data-tab="today" onclick="switchTab('today')">
    <span class="icon">☀️</span>Hari Ini
  </button>
  <button class="nav-btn" data-tab="journal" onclick="switchTab('journal')">
    <span class="icon">📔</span>Jurnal
  </button>
  <button class="nav-btn" data-tab="monthly" onclick="switchTab('monthly')">
    <span class="icon">🗓️</span>Bulanan
  </button>
  <button class="nav-btn" data-tab="folder" onclick="switchTab('folder')">
    <span class="icon">📁</span>Folder
  </button>
  <button class="nav-btn" data-tab="settings" onclick="switchTab('settings')">
    <span class="icon">⚙️</span>Kelola
  </button>
</div>

<!-- CONTENT -->
<div id="content"></div>

<script>
// ─── DATA ─────────────────────────────────────────────────────────────────────
const STORAGE_KEY = 'komitmen_restu_v3';
const MONTHS_ID = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const DAYS_ID = ['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
const ICONS = ['📚','🏃','🧘','💪','🎯','✍️','🎨','🎵','🌿','💻','🍎','💧','🙏','📖','🧠','❤️','🌅','⚽','🎭','🔬'];

const LEVELS = [
  {min:0,  max:2,  name:'Pemula',     emoji:'🌱',color:'#a8d5a2',accent:'#2e7d32',bg:'#f0faf0',desc:'Kamu baru mulai! Konsisten terus ya.'},
  {min:3,  max:6,  name:'Berkembang', emoji:'🌿',color:'#81c784',accent:'#1b5e20',bg:'#e8f5e9',desc:'Bagus! Kamu mulai membangun kebiasaan.'},
  {min:7,  max:13, name:'Semangat',   emoji:'🔥',color:'#ffb74d',accent:'#e65100',bg:'#fff3e0',desc:'Seminggu lebih! Kamu luar biasa.'},
  {min:14, max:20, name:'Dedikasi',   emoji:'⚡',color:'#9575cd',accent:'#4527a0',bg:'#ede7f6',desc:'Dua minggu! Konsistensimu menginspirasi.'},
  {min:21, max:29, name:'Pejuang',    emoji:'🏆',color:'#ef5350',accent:'#b71c1c',bg:'#fce4ec',desc:'21 hari! Ini sudah menjadi kebiasaanmu.'},
  {min:30, max:59, name:'Master',     emoji:'💎',color:'#26c6da',accent:'#006064',bg:'#e0f7fa',desc:'Sebulan penuh! Kamu seorang master.'},
  {min:60, max:89, name:'Legenda',    emoji:'👑',color:'#ffd600',accent:'#f57f17',bg:'#fffde7',desc:'Dua bulan! Status legendamu terbukti.'},
  {min:90, max:99999, name:'Abadi',   emoji:'🌟',color:'#f48fb1',accent:'#880e4f',bg:'#fce4ec',desc:'90+ hari! Kamu adalah inspirasi sejati.'},
];

const FALLBACKS = {
  'Pemula':    ['Ayo mulai harimu!','Langkah pertama selalu yang terberat!','Kamu bisa!'],
  'Berkembang':['Terus pertahankan ritme ini!','Kebiasaan sedang terbentuk!','Jangan berhenti sekarang!'],
  'Semangat':  ['Api semangatmu menyala!','Seminggu sudah! Luar biasa!','Kamu membuktikan komitmenmu!'],
  'Dedikasi':  ['Dedikasimu menginspirasi!','Terus maju, pantang mundur!','Kamu melewati batas kebanyakan orang!'],
  'Pejuang':   ['21 hari = kebiasaan sejati!','Jiwa pejuang sejati!','Ini sudah jadi hidupmu!'],
  'Master':    ['Selamat! Kamu master komitmen!','30 hari tanpa henti!','Tidak ada yang bisa menghentikanmu!'],
  'Legenda':   ['Namamu terukir dalam sejarah!','Dua bulan penuh komitmen!','Kamu sudah jadi contoh nyata!'],
  'Abadi':     ['Kamu adalah legenda yang hidup!','90+ hari tanpa henti!','Tak ada kata menyerah dalam kamusmu!'],
};

function todayStr(){return new Date().toISOString().split('T')[0]}
function monthStr(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}

function loadData(){
  try{const r=localStorage.getItem(STORAGE_KEY);return r?JSON.parse(r):null}catch{return null}
}
function saveData(){
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(D))}catch{}
}

let D = loadData() || {
  activities:[],dailyLogs:{},journals:{},monthlyNotes:{},
  folders:{},streak:0,lastDate:todayStr(),aiMessages:{}
};

// Check if new day → update streak
(function checkStreak(){
  const today=todayStr();
  if(D.lastDate !== today){
    const logs=D.dailyLogs[D.lastDate]||{};
    const allDone=D.activities.length>0 && D.activities.every(a=>logs[a.id]);
    D.streak = allDone ? D.streak+1 : 0;
    D.lastDate=today;
    saveData();
  }
})();

function getLevel(streak){return LEVELS.find(l=>streak>=l.min&&streak<=l.max)||LEVELS[0]}
function applyTheme(level){
  document.documentElement.style.setProperty('--accent',level.accent);
  document.documentElement.style.setProperty('--light',level.bg);
  document.documentElement.style.setProperty('--color',level.color);
  document.documentElement.style.setProperty('--dark',level.accent);
  document.documentElement.style.setProperty('--shadow',level.color+'44');
}

// ─── STATE ────────────────────────────────────────────────────────────────────
let currentTab = 'today';
let selectedDate = todayStr();
let selectedMonth = monthStr();
let addingActivity = false;
let newIcon = '🎯';
let aiLoading = false;
let showEmojiPicker = false;

// ─── HEADER ───────────────────────────────────────────────────────────────────
function renderHeader(){
  const level=getLevel(D.streak);
  applyTheme(level);
  const today=new Date();
  document.getElementById('header-date').textContent=
    today.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  document.getElementById('badge-emoji').textContent=level.emoji;
  document.getElementById('badge-name').textContent=level.name;
  document.getElementById('badge-num').textContent=D.streak+'🔥';
  document.getElementById('header-quote').textContent='💬 '+level.desc;
}

// ─── TABS ─────────────────────────────────────────────────────────────────────
function switchTab(tab){
  currentTab=tab;
  document.querySelectorAll('.nav-btn').forEach(b=>{
    b.classList.toggle('active',b.dataset.tab===tab);
  });
  render();
}

// ─── MAIN RENDER ─────────────────────────────────────────────────────────────
function render(){
  renderHeader();
  const c=document.getElementById('content');
  c.style.animation='none';c.offsetHeight;c.style.animation='slideUp .3s ease';
  if(currentTab==='today') c.innerHTML=renderToday();
  else if(currentTab==='journal') c.innerHTML=renderJournal();
  else if(currentTab==='monthly') c.innerHTML=renderMonthly();
  else if(currentTab==='folder') c.innerHTML=renderFolder();
  else if(currentTab==='settings') c.innerHTML=renderSettings();
  bindEvents();
}

// ─── TODAY ────────────────────────────────────────────────────────────────────
function renderToday(){
  const today=todayStr();
  const level=getLevel(D.streak);
  const logs=D.dailyLogs[today]||{};
  const done=D.activities.filter(a=>logs[a.id]).length;
  const total=D.activities.length;
  const allDone=total>0&&done===total;
  const savedMsg=D.aiMessages[today]||'';

  // Companion
  const bigOrb=allDone&&!aiLoading;
  const orbStyle=bigOrb?'big':'';

  let companionHTML=`
  <div id="companion-wrap">
    <div id="companion-orb" class="${orbStyle}">${aiLoading?'<span class="spin">⏳</span>':level.emoji}</div>
    <div id="companion-msg" class="${savedMsg?'show':''}">${savedMsg}</div>
    <button id="again-btn" class="${allDone?'show':''} btn sm outline" onclick="triggerAI()">✨ Minta motivasi lagi</button>
  </div>`;

  // Progress ring SVG
  const r=26,cx=32,cy=32,circ=2*Math.PI*r;
  const pct=total>0?done/total:0;
  const dash=pct*circ;
  const ringHTML=`<svg width="60" height="60" style="transform:rotate(-90deg)">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#e0e0e0" stroke-width="6"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${level.accent}" stroke-width="6"
      stroke-dasharray="${dash} ${circ}" stroke-linecap="round"/>
  </svg><div class="ring-text">${done}/${total}</div>`;

  // Activities
  let actsHTML='';
  if(!D.activities.length){
    actsHTML=`<div class="empty">Belum ada kegiatan.<br>Tambah di tab ⚙️ Kelola!</div>`;
  } else {
    D.activities.forEach(act=>{
      const checked=!!logs[act.id];
      actsHTML+=`<div class="act-item ${checked?'done':''}" onclick="toggleAct('${act.id}')">
        <div class="act-check">${checked?'✓':''}</div>
        <span style="font-size:22px">${act.icon}</span>
        <span class="act-name">${act.name}</span>
      </div>`;
    });
  }

  // Journal
  const jText=D.journals[today]||'';

  return `
  <div class="card">${companionHTML}</div>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <div class="card-title">📋 Kegiatan Hari Ini</div>
      <div class="ring-wrap">${ringHTML}</div>
    </div>
    ${actsHTML}
  </div>
  <div class="card">
    <div class="card-title">✍️ Jurnal Singkat Hari Ini</div>
    <textarea id="journal-today" rows="4" placeholder="Bagaimana harimu? Apa yang kamu syukuri?">${jText}</textarea>
    <div style="margin-top:10px">
      <button class="btn sm" onclick="saveJournalToday()">💾 Simpan Jurnal</button>
    </div>
  </div>`;
}

function toggleAct(id){
  const today=todayStr();
  const logs=D.dailyLogs[today]||{};
  logs[id]=!logs[id];
  D.dailyLogs[today]=logs;
  saveData();
  const allDone=D.activities.length>0&&D.activities.every(a=>logs[a.id]);
  if(allDone && !D.aiMessages[today]) triggerAI();
  else render();
}

function saveJournalToday(){
  const txt=document.getElementById('journal-today')?.value||'';
  D.journals[todayStr()]=txt;
  saveData();
  showToast('Jurnal tersimpan! 📔');
}

async function triggerAI(){
  if(aiLoading)return;
  aiLoading=true;
  const orb=document.getElementById('companion-orb');
  const msg=document.getElementById('companion-msg');
  const again=document.getElementById('again-btn');
  if(orb){orb.innerHTML='<span class="spin">⏳</span>';orb.className=''}
  if(msg){msg.textContent='';msg.className='companion-msg'}
  if(again)again.className='btn sm outline';

  const level=getLevel(D.streak);
  const acts=D.activities.map(a=>`${a.icon} ${a.name}`).join(', ');
  const prompt=`Kamu adalah asisten motivasi bernama "Restu" yang hangat dan supportif seperti Duolingo. Pengguna baru menyelesaikan semua kegiatan hariannya: ${acts}. Streak mereka ${D.streak} hari, level: ${level.name} (${level.emoji}). Berikan pesan motivasi singkat (maks 2 kalimat), personal, dan menyentuh. Bahasa Indonesia yang hangat. Tanpa tanda asterisk atau markdown.`;

  try{
    const resp=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:1000,
        messages:[{role:'user',content:prompt}]
      })
    });
    const json=await resp.json();
    const text=json?.content?.[0]?.text;
    if(text){
      D.aiMessages[todayStr()]=text;
      saveData();
    }
  } catch(e){
    const fb=FALLBACKS[level.name];
    D.aiMessages[todayStr()]=fb[Math.floor(Math.random()*fb.length)];
    saveData();
  }
  aiLoading=false;
  render();
}

// ─── JOURNAL ──────────────────────────────────────────────────────────────────
function renderJournal(){
  const level=getLevel(D.streak);
  const jText=D.journals[selectedDate]||'';
  const logs=D.dailyLogs[selectedDate]||{};
  const aiMsg=D.aiMessages[selectedDate]||'';

  let tagsHTML='';
  if(D.activities.length){
    D.activities.forEach(a=>{
      const ok=!!logs[a.id];
      tagsHTML+=`<span class="tag ${ok?'done':''}">${a.icon} ${a.name} ${ok?'✓':'✗'}</span> `;
    });
  }

  const dateLabel=new Date(selectedDate+'T00:00:00').toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

  return `
  <div class="card">
    <div class="card-title">📔 Pilih Tanggal</div>
    <input type="date" id="journal-date-pick" value="${selectedDate}" max="${todayStr()}" onchange="changeJournalDate(this.value)"/>
  </div>
  <div class="card">
    <div class="card-title">📅 ${dateLabel}</div>
    ${tagsHTML?`<div style="margin-bottom:12px;line-height:2">${tagsHTML}</div>`:''}
    <textarea id="journal-text" rows="8" placeholder="Tuliskan jurnal harianmu di sini...">${jText}</textarea>
    <div style="margin-top:10px">
      <button class="btn" onclick="saveJournalDate()">💾 Simpan Jurnal</button>
    </div>
    ${aiMsg?`<div style="margin-top:12px;padding:10px 14px;background:var(--light);border:1.5px solid var(--color);border-radius:12px;font-size:13px;font-weight:700;color:var(--dark)">💬 Pesan Restu: ${aiMsg}</div>`:''}
  </div>`;
}

function changeJournalDate(v){selectedDate=v;render()}
function saveJournalDate(){
  const txt=document.getElementById('journal-text')?.value||'';
  D.journals[selectedDate]=txt;
  saveData();
  showToast('Jurnal tersimpan! 📔');
}

// ─── MONTHLY ─────────────────────────────────────────────────────────────────
function renderMonthly(){
  const level=getLevel(D.streak);
  const [y,m]=selectedMonth.split('-').map(Number);
  const firstDay=new Date(y,m-1,1).getDay();
  const daysInMonth=new Date(y,m,0).getDate();
  const today=todayStr();

  // Calendar
  let calHTML=`<div class="cal-grid">`;
  DAYS_ID.forEach(d=>{calHTML+=`<div class="cal-head">${d}</div>`});
  for(let i=0;i<firstDay;i++)calHTML+=`<div></div>`;
  for(let d=1;d<=daysInMonth;d++){
    const ds=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const pct=getDayPct(ds);
    const isToday=ds===today;
    const hasJ=!!(D.journals[ds]?.trim());
    let bg='#f5f5f5',color='#666';
    if(pct===1&&D.activities.length){bg=level.accent;color='#fff'}
    else if(pct>0&&D.activities.length){bg=level.color+(Math.round(pct*160+40).toString(16).padStart(2,'0'));color=pct>0.5?'#fff':'#555'}
    const dotColor=pct>0.5?'#fff':level.accent;
    calHTML+=`<div class="cal-day ${isToday?'today':''}" style="background:${bg};color:${color}" onclick="openDayJournal('${ds}')">
      ${d}${hasJ?`<div class="cal-dot" style="background:${dotColor}"></div>`:''}
    </div>`;
  }
  calHTML+=`</div>
  <div style="margin-top:10px;display:flex;gap:12px;flex-wrap:wrap;font-size:11px;font-weight:700;color:#aaa">
    <span>⬜ Belum</span><span style="color:${level.accent}">✅ Selesai semua</span><span>• ada jurnal</span>
  </div>`;

  const monthNote=D.monthlyNotes[selectedMonth]||'';
  const monthLabel=MONTHS_ID[m-1]+' '+y;

  return `
  <div class="card">
    <div class="card-title">🗓️ Pilih Bulan</div>
    <input type="month" id="month-pick" value="${selectedMonth}" max="${monthStr()}" onchange="changeMonth(this.value)"/>
  </div>
  <div class="card">
    <div class="card-title">📆 ${monthLabel}</div>
    ${calHTML}
  </div>
  <div class="card">
    <div class="card-title">📝 Catatan Bulanan</div>
    <textarea id="monthly-note" rows="5" placeholder="Pencapaian bulan ini, target bulan depan, refleksi...">${monthNote}</textarea>
    <div style="margin-top:10px">
      <button class="btn" onclick="saveMonthlyNote()">💾 Simpan Catatan</button>
    </div>
  </div>`;
}

function openDayJournal(ds){selectedDate=ds;switchTab('journal')}
function changeMonth(v){selectedMonth=v;render()}
function saveMonthlyNote(){
  const txt=document.getElementById('monthly-note')?.value||'';
  D.monthlyNotes[selectedMonth]=txt;
  saveData();
  showToast('Catatan bulanan tersimpan! 🗓️');
}
function getDayPct(ds){
  const logs=D.dailyLogs[ds]||{};
  if(!D.activities.length)return 0;
  return D.activities.filter(a=>logs[a.id]).length/D.activities.length;
}

// ─── FOLDER ───────────────────────────────────────────────────────────────────
function renderFolder(){
  const level=getLevel(D.streak);
  const cm=monthStr();
  const [y,m]=cm.split('-').map(Number);
  const daysInMonth=new Date(y,m,0).getDate();
  let completeDays=0,journalDays=0;
  for(let d=1;d<=daysInMonth;d++){
    const ds=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    if(getDayPct(ds)===1&&D.activities.length)completeDays++;
    if(D.journals[ds]?.trim())journalDays++;
  }

  const folderNote=D.folders[cm]?.notes||'';

  // Archive
  const allMonths=[...new Set(Object.keys(D.dailyLogs).map(d=>d.slice(0,7)))]
    .filter(mk=>mk!==cm).sort().reverse();
  let archiveHTML='';
  if(!allMonths.length){
    archiveHTML=`<div class="empty">Belum ada arsip.</div>`;
  } else {
    allMonths.forEach(mk=>{
      const [ay,am]=mk.split('-').map(Number);
      const dim=new Date(ay,am,0).getDate();
      let fd=0;
      for(let d=1;d<=dim;d++){
        const ds=`${ay}-${String(am).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        if(getDayPct(ds)===1&&D.activities.length)fd++;
      }
      archiveHTML+=`<div class="archive-row" onclick="openArchive('${mk}')">
        <div>
          <div style="font-weight:800;font-size:14px;color:#333">📁 ${MONTHS_ID[am-1]} ${ay}</div>
          <div style="font-size:12px;color:#888;font-weight:600">${fd} hari penuh • ${D.monthlyNotes[mk]?'ada catatan':'tanpa catatan'}</div>
        </div>
        <span style="font-size:18px;color:#ccc">›</span>
      </div>`;
    });
  }

  return `
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <div class="card-title" style="margin:0">📁 ${MONTHS_ID[m-1]} ${y}</div>
      <span style="background:var(--light);color:var(--dark);border-radius:12px;padding:4px 12px;font-size:12px;font-weight:800;border:1.5px solid var(--color)">Bulan Ini</span>
    </div>
    <div style="font-size:13px;color:#888;font-weight:600;margin-bottom:14px">Semua data bulan ini tersimpan otomatis di folder ini.</div>
    <div class="stats-grid">
      <div class="stat-box"><div class="stat-emoji">✅</div><div class="stat-val">${completeDays}</div><div class="stat-label">Hari Penuh</div></div>
      <div class="stat-box"><div class="stat-emoji">📔</div><div class="stat-val">${journalDays}</div><div class="stat-label">Jurnal</div></div>
      <div class="stat-box"><div class="stat-emoji">🔥</div><div class="stat-val">${D.streak}</div><div class="stat-label">Streak</div></div>
    </div>
    <div style="font-weight:800;font-size:14px;color:#555;margin-bottom:8px">📌 Catatan Folder</div>
    <textarea id="folder-note" rows="4" placeholder="Catatan khusus bulan ini, target, agenda...">${folderNote}</textarea>
    <div style="margin-top:10px">
      <button class="btn sm" onclick="saveFolderNote()">💾 Simpan</button>
    </div>
  </div>
  <div class="card">
    <div class="card-title">🗂️ Arsip Bulan Sebelumnya</div>
    ${archiveHTML}
  </div>`;
}

function saveFolderNote(){
  const txt=document.getElementById('folder-note')?.value||'';
  D.folders[monthStr()]={notes:txt};
  saveData();
  showToast('Catatan folder tersimpan! 📁');
}
function openArchive(mk){selectedMonth=mk;switchTab('monthly')}

// ─── SETTINGS ────────────────────────────────────────────────────────────────
function renderSettings(){
  const level=getLevel(D.streak);

  // Add panel
  let addPanel='';
  if(addingActivity){
    let emojiGrid='';
    ICONS.forEach(ic=>{
      emojiGrid+=`<button class="emoji-opt ${ic===newIcon?'sel':''}" onclick="pickIcon('${ic}')">${ic}</button>`;
    });
    addPanel=`<div class="add-panel">
      <div style="font-weight:800;font-size:14px;color:#333;margin-bottom:10px">Kegiatan Baru</div>
      <div style="display:flex;gap:8px;margin-bottom:10px">
        <button onclick="toggleEmojiPicker()" style="width:44px;height:44px;border-radius:12px;font-size:22px;background:#fff;border:2px solid var(--color);cursor:pointer;flex-shrink:0">${newIcon}</button>
        <input type="text" id="new-act-name" placeholder="Nama kegiatan..." onkeydown="if(event.key==='Enter')addActivity()"/>
      </div>
      ${showEmojiPicker?`<div class="emoji-grid">${emojiGrid}</div>`:''}
      <div style="display:flex;gap:8px">
        <button class="btn" style="flex:1" onclick="addActivity()">✓ Simpan</button>
        <button class="btn outline" onclick="cancelAdd()">Batal</button>
      </div>
    </div>`;
  }

  // List
  let listHTML='';
  if(!D.activities.length){
    listHTML=`<div class="empty">Belum ada kegiatan. Tambahkan rutinmu!</div>`;
  } else {
    D.activities.forEach(act=>{
      listHTML+=`<div class="manage-item">
        <span style="font-size:22px">${act.icon}</span>
        <span style="flex:1;font-weight:700;font-size:15px;color:#333">${act.name}</span>
        <button class="btn sm danger" onclick="removeActivity('${act.id}')">✕</button>
      </div>`;
    });
  }

  // Levels
  let levelsHTML='';
  LEVELS.forEach(l=>{
    const active=D.streak>=l.min&&D.streak<=l.max;
    levelsHTML+=`<div class="level-row ${active?'active':''}" style="${active?`background:${l.bg};border-color:${l.color}`:''}">
      <span style="font-size:22px">${l.emoji}</span>
      <div style="flex:1">
        <div style="font-weight:800;font-size:13px;color:${l.accent}">${l.name}</div>
        <div style="font-size:11px;color:#888;font-weight:600">${l.max===99999?l.min+'+ hari':l.min+'–'+l.max+' hari'}</div>
      </div>
      ${active?`<span class="level-here">KAMU DI SINI</span>`:''}
    </div>`;
  });

  return `
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <div class="card-title" style="margin:0">⚙️ Kelola Kegiatan</div>
      ${!addingActivity?`<button class="btn sm" onclick="startAdd()">+ Tambah</button>`:''}
    </div>
    ${addPanel}
    ${listHTML}
  </div>
  <div class="card">
    <div class="card-title">🏅 Level Streak</div>
    ${levelsHTML}
  </div>
  <div class="card">
    <div class="card-title">⚠️ Reset</div>
    <button class="btn danger" style="width:100%;padding:12px" onclick="resetStreak()">🔄 Reset Streak ke 0</button>
  </div>`;
}

function startAdd(){addingActivity=true;newIcon='🎯';showEmojiPicker=false;render()}
function cancelAdd(){addingActivity=false;showEmojiPicker=false;render()}
function toggleEmojiPicker(){showEmojiPicker=!showEmojiPicker;render();document.getElementById('new-act-name')?.focus()}
function pickIcon(ic){newIcon=ic;showEmojiPicker=false;render();document.getElementById('new-act-name')?.focus()}
function addActivity(){
  const name=document.getElementById('new-act-name')?.value?.trim()||'';
  if(!name)return;
  D.activities.push({id:Date.now().toString(),name,icon:newIcon});
  saveData();addingActivity=false;showEmojiPicker=false;render();
  showToast('Kegiatan ditambahkan! 🎯');
}
function removeActivity(id){
  if(!confirm('Hapus kegiatan ini?'))return;
  D.activities=D.activities.filter(a=>a.id!==id);
  saveData();render();
}
function resetStreak(){
  if(!confirm('Reset streak ke 0? Jurnal & kegiatan tetap aman.'))return;
  D.streak=0;D.aiMessages={};saveData();render();
  showToast('Streak direset. Ayo mulai lagi! 💪');
}

// ─── BIND EVENTS ─────────────────────────────────────────────────────────────
function bindEvents(){
  // auto-save textarea on blur
  const jt=document.getElementById('journal-text');
  if(jt)jt.addEventListener('blur',saveJournalDate);
  const jto=document.getElementById('journal-today');
  if(jto)jto.addEventListener('blur',saveJournalToday);
  const mn=document.getElementById('monthly-note');
  if(mn)mn.addEventListener('blur',saveMonthlyNote);
  const fn=document.getElementById('folder-note');
  if(fn)fn.addEventListener('blur',saveFolderNote);
}

// ─── TOAST ────────────────────────────────────────────────────────────────────
function showToast(msg){
  const t=document.createElement('div');
  t.textContent=msg;
  Object.assign(t.style,{
    position:'fixed',bottom:'24px',left:'50%',transform:'translateX(-50%)',
    background:'#333',color:'#fff',padding:'10px 20px',borderRadius:'20px',
    fontFamily:'Nunito,sans-serif',fontWeight:700,fontSize:14,
    zIndex:1000,animation:'fadeIn .3s ease',whiteSpace:'nowrap',
    boxShadow:'0 4px 20px rgba(0,0,0,0.2)',
  });
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),2500);
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
render();
</script>
</body>
</html>
